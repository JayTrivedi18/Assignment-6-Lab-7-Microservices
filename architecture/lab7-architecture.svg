<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="740" viewBox="0 0 900 740" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1629;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2340;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="serviceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mongoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="atlasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ed64;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00684a;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4ade80"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#fb923c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="740" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">CampusConnect — Lab 7 Architecture</text>
  <text x="450" y="56" text-anchor="middle" fill="#94a3b8" font-size="12">API Gateway · Service Discovery · Cloud Deployment</text>

  <!-- ── Internet / Client ─────────────────────────────────────────── -->
  <rect x="325" y="70" width="250" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="91" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">🌐  Internet / Postman</text>
  <text x="450" y="109" text-anchor="middle" fill="#94a3b8" font-size="11">HTTP  http://localhost:4000  (local)</text>

  <!-- Arrow Internet → Gateway -->
  <line x1="450" y1="122" x2="450" y2="155" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)" stroke-dasharray="none"/>
  <text x="462" y="142" fill="#a78bfa" font-size="10">HTTP :4000</text>

  <!-- ── API Gateway ────────────────────────────────────────────────── -->
  <rect x="280" y="155" width="340" height="80" rx="12" fill="url(#gatewayGrad)" filter="url(#shadow)"/>
  <text x="450" y="178" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">⚡ API Gateway</text>
  <text x="450" y="196" text-anchor="middle" fill="#ddd6fe" font-size="11">Port 4000  (only externally exposed port)</text>
  <text x="450" y="212" text-anchor="middle" fill="#c4b5fd" font-size="10">/health  /users/*  /products/*  /orders/*</text>

  <!-- Docker Network boundary box -->
  <rect x="30" y="260" width="840" height="300" rx="14" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="50" y="282" fill="#475569" font-size="11" font-weight="600">Docker Network: campus-network  (internal — no host ports)</text>

  <!-- Arrows Gateway → Services -->
  <!-- Gateway → User -->
  <line x1="360" y1="235" x2="200" y2="305" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="255" y="271" fill="#38bdf8" font-size="10" transform="rotate(-25,255,271)">/users/*</text>

  <!-- Gateway → Product -->
  <line x1="450" y1="235" x2="450" y2="305" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="456" y="273" fill="#38bdf8" font-size="10">/products/*</text>

  <!-- Gateway → Order -->
  <line x1="540" y1="235" x2="700" y2="305" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="600" y="271" fill="#38bdf8" font-size="10" transform="rotate(25,630,271)">/orders/*</text>

  <!-- ── User Service ───────────────────────────────────────────────── -->
  <rect x="60" y="305" width="200" height="62" rx="10" fill="url(#serviceGrad)" filter="url(#shadow)"/>
  <text x="160" y="328" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">👤 User Service</text>
  <text x="160" y="345" text-anchor="middle" fill="#bae6fd" font-size="11">Internal :3001</text>
  <text x="160" y="360" text-anchor="middle" fill="#bae6fd" font-size="10">No host port mapping</text>

  <!-- ── Product Service ───────────────────────────────────────────── -->
  <rect x="350" y="305" width="200" height="62" rx="10" fill="url(#serviceGrad)" filter="url(#shadow)"/>
  <text x="450" y="328" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">📦 Product Service</text>
  <text x="450" y="345" text-anchor="middle" fill="#bae6fd" font-size="11">Internal :3002</text>
  <text x="450" y="360" text-anchor="middle" fill="#bae6fd" font-size="10">No host port mapping</text>

  <!-- ── Order Service ─────────────────────────────────────────────── -->
  <rect x="640" y="305" width="200" height="62" rx="10" fill="url(#serviceGrad)" filter="url(#shadow)"/>
  <text x="740" y="328" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">🛒 Order Service</text>
  <text x="740" y="345" text-anchor="middle" fill="#bae6fd" font-size="11">Internal :3003</text>
  <text x="740" y="360" text-anchor="middle" fill="#bae6fd" font-size="10">No host port mapping</text>

  <!-- Order → User (inter-service) -->
  <path d="M 640 330 Q 510 285 260 330" stroke="#fb923c" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>
  <text x="430" y="290" fill="#fb923c" font-size="10" text-anchor="middle">Lab 6: inter-service REST validation</text>

  <!-- Order → Product (inter-service) -->
  <path d="M 640 350 Q 590 325 550 350" stroke="#fb923c" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>

  <!-- Arrows Services → MongoDB (local) -->
  <line x1="160" y1="367" x2="160" y2="420" stroke="#4ade80" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <line x1="450" y1="367" x2="450" y2="420" stroke="#4ade80" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <line x1="740" y1="367" x2="740" y2="420" stroke="#4ade80" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

  <!-- ── MongoDB (local) ───────────────────────────────────────────── -->
  <rect x="65" y="420" width="190" height="55" rx="10" fill="url(#mongoGrad)" filter="url(#shadow)"/>
  <text x="160" y="443" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">🍃 User MongoDB</text>
  <text x="160" y="460" text-anchor="middle" fill="#bbf7d0" font-size="10">campusconnect_users</text>

  <rect x="355" y="420" width="190" height="55" rx="10" fill="url(#mongoGrad)" filter="url(#shadow)"/>
  <text x="450" y="443" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">🍃 Product MongoDB</text>
  <text x="450" y="460" text-anchor="middle" fill="#bbf7d0" font-size="10">campusconnect_products</text>

  <rect x="645" y="420" width="190" height="55" rx="10" fill="url(#mongoGrad)" filter="url(#shadow)"/>
  <text x="740" y="443" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">🍃 Order MongoDB</text>
  <text x="740" y="460" text-anchor="middle" fill="#bbf7d0" font-size="10">campusconnect_orders</text>

  <!-- ── Cloud section ─────────────────────────────────────────────── -->
  <text x="450" y="600" text-anchor="middle" fill="#64748b" font-size="13" font-weight="700">── Cloud Deployment (MongoDB Atlas) ──</text>

  <!-- Atlas box -->
  <rect x="200" y="615" width="500" height="65" rx="12" fill="#0c2d1a" stroke="#00ed64" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="640" text-anchor="middle" fill="#00ed64" font-size="13" font-weight="700">🌿 MongoDB Atlas</text>
  <text x="450" y="657" text-anchor="middle" fill="#86efac" font-size="10">Cloud-hosted databases — one cluster per service collection</text>
  <text x="450" y="672" text-anchor="middle" fill="#86efac" font-size="10">campusconnect_users  ·  campusconnect_products  ·  campusconnect_orders</text>

  <!-- Services → Atlas dashed lines (cloud mode) -->
  <line x1="160" y1="475" x2="310" y2="615" stroke="#00ed64" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.6"/>
  <line x1="450" y1="475" x2="450" y2="615" stroke="#00ed64" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.6"/>
  <line x1="740" y1="475" x2="590" y2="615" stroke="#00ed64" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.6"/>

  <text x="200" y="595" fill="#4ade80" font-size="9" text-anchor="middle">cloud mode</text>
  <text x="450" y="595" fill="#4ade80" font-size="9" text-anchor="middle">cloud mode</text>
  <text x="700" y="595" fill="#4ade80" font-size="9" text-anchor="middle">cloud mode</text>

  <!-- Legend -->
  <rect x="30" y="700" width="840" height="30" rx="8" fill="#1e293b" opacity="0.7"/>
  <line x1="55" y1="715" x2="85" y2="715" stroke="#a78bfa" stroke-width="2"/>
  <text x="90" y="719" fill="#94a3b8" font-size="10">External HTTP</text>
  <line x1="185" y1="715" x2="215" y2="715" stroke="#38bdf8" stroke-width="2"/>
  <text x="220" y="719" fill="#94a3b8" font-size="10">Proxy routing</text>
  <line x1="315" y1="715" x2="345" y2="715" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="350" y="719" fill="#94a3b8" font-size="10">Inter-service REST (Lab 6)</text>
  <line x1="505" y1="715" x2="535" y2="715" stroke="#4ade80" stroke-width="2"/>
  <text x="540" y="719" fill="#94a3b8" font-size="10">MongoDB (local)</text>
  <line x1="635" y1="715" x2="665" y2="715" stroke="#00ed64" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.8"/>
  <text x="670" y="719" fill="#94a3b8" font-size="10">Atlas (cloud)</text>
</svg>
