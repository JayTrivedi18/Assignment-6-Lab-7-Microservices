<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="productGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="orderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="mongoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>

    <!-- Markers for arrows -->
    <marker id="arrowExternal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowInternal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowDb" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4ade80"/>
    </marker>
    
    <!-- Filter for subtle drop shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Title Section -->
  <text x="550" y="45" text-anchor="middle" font-size="24" font-weight="bold" fill="url(#headerGrad)">
    CampusConnect Microservices Architecture (Lab 6)
  </text>
  <text x="550" y="70" text-anchor="middle" font-size="14" fill="#94a3b8">
    Decomposed Architecture • Database-per-Service Pattern • Isolated Docker Compose Mesh
  </text>

  <!-- ==================== HOST / CLIENT SECTION ==================== -->
  <g transform="translate(100, 95)" filter="url(#shadow)">
    <rect width="900" height="75" rx="12" fill="url(#clientGrad)" stroke="#475569" stroke-width="1.5"/>
    <circle cx="40" cy="37" r="18" fill="#38bdf8" fill-opacity="0.2"/>
    <text x="40" y="43" text-anchor="middle" font-size="18" fill="#38bdf8">💻</text>
    <text x="75" y="32" font-size="17" font-weight="bold" fill="#f8fafc">Client / Postman Test Runner (Host Environment)</text>
    <text x="75" y="54" font-size="13" fill="#cbd5e1">
      Direct HTTP requests via exposed host ports (http://localhost:3001, :3002, :3003)
    </text>
  </g>

  <!-- External Flow Arrows from Host to Services -->
  <!-- To User Service -->
  <path d="M 280 170 L 280 250" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrowExternal)"/>
  <rect x="220" y="200" width="120" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="280" y="215" text-anchor="middle" font-size="11" fill="#38bdf8" font-weight="600">localhost:3001</text>

  <!-- To Order Service -->
  <path d="M 550 170 L 550 250" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowExternal)"/>
  <rect x="490" y="200" width="120" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="550" y="215" text-anchor="middle" font-size="11" fill="#38bdf8" font-weight="600">localhost:3003</text>

  <!-- To Product Service -->
  <path d="M 820 170 L 820 250" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrowExternal)"/>
  <rect x="760" y="200" width="120" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="820" y="215" text-anchor="middle" font-size="11" fill="#38bdf8" font-weight="600">localhost:3002</text>

  <!-- ==================== DOCKER BRIDGE NETWORK BOUNDARY ==================== -->
  <rect x="60" y="240" width="980" height="540" rx="16" fill="#1e293b" fill-opacity="0.4" stroke="#0284c7" stroke-width="2" stroke-dasharray="8,6"/>
  <rect x="80" y="228" width="280" height="26" rx="6" fill="#0369a1"/>
  <text x="220" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">
    🐳 Docker Network: campus-network (bridge)
  </text>

  <!-- ==================== MICROSERVICES LAYER ==================== -->

  <!-- 1. USER SERVICE -->
  <g transform="translate(100, 270)" filter="url(#shadow)">
    <rect width="260" height="200" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <rect width="260" height="42" rx="12" fill="url(#userGrad)"/>
    <rect y="30" width="260" height="12" fill="url(#userGrad)"/>
    <text x="130" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">User Service</text>
    
    <text x="16" y="66" font-size="12" font-weight="bold" fill="#38bdf8">Container:</text>
    <text x="90" y="66" font-size="12" fill="#e2e8f0">user-service</text>
    
    <text x="16" y="88" font-size="12" font-weight="bold" fill="#38bdf8">Internal Port:</text>
    <text x="96" y="88" font-size="12" fill="#e2e8f0">3001 (Host 3001)</text>

    <text x="16" y="110" font-size="12" font-weight="bold" fill="#38bdf8">Endpoints:</text>
    <text x="16" y="128" font-size="11" fill="#cbd5e1">• GET /users, GET /users/:id</text>
    <text x="16" y="146" font-size="11" fill="#cbd5e1">• POST /users (id, name, email)</text>
    <text x="16" y="164" font-size="11" fill="#cbd5e1">• PUT /users/:id, DELETE /users/:id</text>
    <text x="16" y="182" font-size="11" fill="#cbd5e1">• GET /health</text>
  </g>

  <!-- 2. ORDER SERVICE (ORCHESTRATOR) -->
  <g transform="translate(420, 270)" filter="url(#shadow)">
    <rect width="260" height="200" rx="12" fill="#0f172a" stroke="#7c3aed" stroke-width="2"/>
    <rect width="260" height="42" rx="12" fill="url(#orderGrad)"/>
    <rect y="30" width="260" height="12" fill="url(#orderGrad)"/>
    <text x="130" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Order Service</text>
    
    <text x="16" y="66" font-size="12" font-weight="bold" fill="#c084fc">Container:</text>
    <text x="92" y="66" font-size="12" fill="#e2e8f0">order-service</text>
    
    <text x="16" y="88" font-size="12" font-weight="bold" fill="#c084fc">Internal Port:</text>
    <text x="98" y="88" font-size="12" fill="#e2e8f0">3003 (Host 3003)</text>

    <text x="16" y="110" font-size="12" font-weight="bold" fill="#c084fc">Orchestration Endpoints:</text>
    <text x="16" y="128" font-size="11" fill="#cbd5e1">• POST /orders (REST validation)</text>
    <text x="16" y="146" font-size="11" fill="#cbd5e1">• GET /orders, GET /orders/:id</text>
    <text x="16" y="164" font-size="11" fill="#cbd5e1">• GET /health</text>
    <text x="16" y="184" font-size="10.5" fill="#fbbf24">⏱️ 3s Timeout | 404 &amp; 503 Resilient</text>
  </g>

  <!-- 3. PRODUCT SERVICE -->
  <g transform="translate(740, 270)" filter="url(#shadow)">
    <rect width="260" height="200" rx="12" fill="#0f172a" stroke="#0d9488" stroke-width="2"/>
    <rect width="260" height="42" rx="12" fill="url(#productGrad)"/>
    <rect y="30" width="260" height="12" fill="url(#productGrad)"/>
    <text x="130" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Product Service</text>
    
    <text x="16" y="66" font-size="12" font-weight="bold" fill="#2dd4bf">Container:</text>
    <text x="92" y="66" font-size="12" fill="#e2e8f0">product-service</text>
    
    <text x="16" y="88" font-size="12" font-weight="bold" fill="#2dd4bf">Internal Port:</text>
    <text x="98" y="88" font-size="12" fill="#e2e8f0">3002 (Host 3002)</text>

    <text x="16" y="110" font-size="12" font-weight="bold" fill="#2dd4bf">Endpoints:</text>
    <text x="16" y="128" font-size="11" fill="#cbd5e1">• GET /products, GET /products/:id</text>
    <text x="16" y="146" font-size="11" fill="#cbd5e1">• POST /products (id, name, price)</text>
    <text x="16" y="164" font-size="11" fill="#cbd5e1">• PUT /products/:id, DELETE /:id</text>
    <text x="16" y="182" font-size="11" fill="#cbd5e1">• GET /health</text>
  </g>

  <!-- ==================== INTER-SERVICE REST CALLS ==================== -->
  <!-- Order -> User (REST) -->
  <path d="M 420 340 L 360 340" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrowInternal)"/>
  <rect x="362" y="315" width="56" height="18" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="390" y="328" text-anchor="middle" font-size="9" fill="#fbbf24" font-weight="bold">REST</text>

  <!-- Order -> Product (REST) -->
  <path d="M 680 340 L 740 340" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrowInternal)"/>
  <rect x="682" y="315" width="56" height="18" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="710" y="328" text-anchor="middle" font-size="9" fill="#fbbf24" font-weight="bold">REST</text>

  <!-- Label for Inter-service Calls -->
  <rect x="340" y="475" width="420" height="30" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="550" y="495" text-anchor="middle" font-size="11.5" fill="#fef3c7" font-weight="600">
    ⚡ Synchronous Inter-Service REST Calls (DNS: http://user-service:3001 &amp; :3002)
  </text>

  <!-- ==================== DATABASE-PER-SERVICE LAYER ==================== -->

  <!-- Connectors: Service to its dedicated DB -->
  <path d="M 230 470 L 230 550" fill="none" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arrowDb)"/>
  <path d="M 550 470 L 550 550" fill="none" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arrowDb)"/>
  <path d="M 870 470 L 870 550" fill="none" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arrowDb)"/>

  <!-- 1. USER MONGODB -->
  <g transform="translate(100, 550)" filter="url(#shadow)">
    <rect width="260" height="180" rx="12" fill="#0f172a" stroke="#15803d" stroke-width="2"/>
    <rect width="260" height="38" rx="12" fill="url(#mongoGrad)"/>
    <rect y="26" width="260" height="12" fill="url(#mongoGrad)"/>
    <text x="130" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">🗄️ user-mongodb</text>
    
    <text x="16" y="58" font-size="12" font-weight="bold" fill="#4ade80">Database:</text>
    <text x="82" y="58" font-size="12" fill="#e2e8f0">campusconnect_users</text>
    
    <text x="16" y="80" font-size="12" font-weight="bold" fill="#4ade80">Internal Port:</text>
    <text x="100" y="80" font-size="12" fill="#e2e8f0">27017 (Not exposed)</text>

    <text x="16" y="104" font-size="12" font-weight="bold" fill="#4ade80">Persistent Volume:</text>
    <rect x="16" y="112" width="228" height="24" rx="4" fill="#14532d"/>
    <text x="130" y="128" text-anchor="middle" font-size="11" fill="#bbf7d0">user-mongo-data:/data/db</text>
    
    <text x="16" y="156" font-size="11" fill="#86efac">🔒 Owned strictly by User Service</text>
  </g>

  <!-- 2. ORDER MONGODB -->
  <g transform="translate(420, 550)" filter="url(#shadow)">
    <rect width="260" height="180" rx="12" fill="#0f172a" stroke="#15803d" stroke-width="2"/>
    <rect width="260" height="38" rx="12" fill="url(#mongoGrad)"/>
    <rect y="26" width="260" height="12" fill="url(#mongoGrad)"/>
    <text x="130" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">🗄️ order-mongodb</text>
    
    <text x="16" y="58" font-size="12" font-weight="bold" fill="#4ade80">Database:</text>
    <text x="82" y="58" font-size="12" fill="#e2e8f0">campusconnect_orders</text>
    
    <text x="16" y="80" font-size="12" font-weight="bold" fill="#4ade80">Internal Port:</text>
    <text x="100" y="80" font-size="12" fill="#e2e8f0">27017 (Not exposed)</text>

    <text x="16" y="104" font-size="12" font-weight="bold" fill="#4ade80">Persistent Volume:</text>
    <rect x="16" y="112" width="228" height="24" rx="4" fill="#14532d"/>
    <text x="130" y="128" text-anchor="middle" font-size="11" fill="#bbf7d0">order-mongo-data:/data/db</text>
    
    <text x="16" y="156" font-size="11" fill="#86efac">🔒 Owned strictly by Order Service</text>
  </g>

  <!-- 3. PRODUCT MONGODB -->
  <g transform="translate(740, 550)" filter="url(#shadow)">
    <rect width="260" height="180" rx="12" fill="#0f172a" stroke="#15803d" stroke-width="2"/>
    <rect width="260" height="38" rx="12" fill="url(#mongoGrad)"/>
    <rect y="26" width="260" height="12" fill="url(#mongoGrad)"/>
    <text x="130" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">🗄️ product-mongodb</text>
    
    <text x="16" y="58" font-size="12" font-weight="bold" fill="#4ade80">Database:</text>
    <text x="82" y="58" font-size="12" fill="#e2e8f0">campusconnect_products</text>
    
    <text x="16" y="80" font-size="12" font-weight="bold" fill="#4ade80">Internal Port:</text>
    <text x="100" y="80" font-size="12" fill="#e2e8f0">27017 (Not exposed)</text>

    <text x="16" y="104" font-size="12" font-weight="bold" fill="#4ade80">Persistent Volume:</text>
    <rect x="16" y="112" width="228" height="24" rx="4" fill="#14532d"/>
    <text x="130" y="128" text-anchor="middle" font-size="11" fill="#bbf7d0">product-mongo-data:/data/db</text>
    
    <text x="16" y="156" font-size="11" fill="#86efac">🔒 Owned strictly by Product Service</text>
  </g>

  <!-- Footer Legend -->
  <g transform="translate(100, 750)">
    <rect x="0" y="0" width="900" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    
    <line x1="20" y1="20" x2="50" y2="20" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="58" y="24" font-size="11" fill="#94a3b8">External Client Ingress</text>

    <line x1="230" y1="20" x2="260" y2="20" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="268" y="24" font-size="11" fill="#94a3b8">Internal Inter-Service REST</text>

    <line x1="470" y1="20" x2="500" y2="20" stroke="#4ade80" stroke-width="2.5"/>
    <text x="508" y="24" font-size="11" fill="#94a3b8">Direct DB Access (Isolated)</text>

    <text x="730" y="24" font-size="11" fill="#cbd5e1" font-weight="bold">🚫 No Cross-DB Queries Permitted</text>
  </g>
</svg>
